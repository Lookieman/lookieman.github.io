# TODO(owner): confirm the status of both accelerators.
internal:
  - title: Statement of work draft generator
    problem: Consultants write each statement of work from scratch, with uneven scope, exclusions and assumptions.
    detail: Retrieval over anonymised past statements of work, filtered by scenario and section. DSPy signatures draft each section, and the tool writes a formatted Word document.
    role: Technical lead and framework designer
    year: 2026
    status: Prototype
    tags: [RAG, LlamaIndex, ChromaDB, DSPy]
  - title: RAG evaluation framework
    problem: Teams could not compare retrieval and answer quality on an internal knowledge base in a repeatable way.
    detail: Measures retrieval (Precision@K, Recall@K, MRR, NDCG) and answers (faithfulness, relevance, correctness) over batches of 100 to 500 questions. Compares hand-written prompts with DSPy programs.
    role: Technical lead and framework designer
    year: 2025
    status: Prototype
    tags: [RAGAS, DSPy, SAP HANA vectors, SAP AI Core]
