---
layout: default
---
<article class="page{% if page.numbered != false %} numbered{% endif %}">
  {% unless page.hide_header %}
  <header class="page-header">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="prose{% if page.wide %} wide{% endif %}">
    {{ content }}
  </div>
</article>
